<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Komari</title><link rel="stylesheet" href="/ink.css"><script type="module" src="/app.mjs"></script></head>
<body>
<main class="shell">
<header><h1 id="site-name">Komari</h1><div class="actions"><span id="updated" class="mono" aria-label="最后成功更新">—</span><button id="refresh">刷新</button><button id="settings-open">设置</button><a href="/traffic" data-route>流量</a><a href="/assets" data-route id="assets-link">资产</a><a href="/admin" id="admin-link">管理</a></div></header>
<p id="error" class="message" role="alert" hidden></p><p id="ping-error" class="message" role="status" hidden></p>
<div id="home"><section id="overview" class="overview" aria-label="全部节点概况"></section>
<div class="toolbar"><div class="filters" aria-label="状态"><button data-status="" aria-pressed="true">全部</button><button data-status="online" aria-pressed="false">在线</button><button data-status="offline" aria-pressed="false">离线</button><button data-status="attention" aria-pressed="false">关注</button></div><div class="tools"><select id="group" aria-label="分组"><option value="">全部分组</option></select><select id="region" aria-label="地区"><option value="">全部地区</option></select><select id="sort" aria-label="排序"><option value="default">默认排序</option><option value="name">名称 ↑</option><option value="speed">实时速率</option><option value="traffic">累计流量</option><option value="price">月化价格</option><option value="cpu">CPU</option><option value="latency">延迟 ↑</option><option value="expiry">到期 ↑</option></select><select id="sort-direction" aria-label="排序方向"><option value="asc">升序</option><option value="desc">降序</option></select><input id="search" type="search" placeholder="搜索节点" aria-label="搜索节点"></div></div>
<div class="section-head"><span id="count" role="status">加载中</span><div class="layouts" aria-label="布局"><button data-view="cards" aria-pressed="true">卡片</button><button data-view="compact" aria-pressed="false">紧凑</button><button data-view="mini" aria-pressed="false">迷你</button><button data-view="list" aria-pressed="false">列表</button><button data-view="board" aria-pressed="false">看板</button></div></div>
<div id="nodes" aria-busy="true"><p class="empty">加载中</p></div>
<section id="renewals" aria-label="续费提醒"></section></div><section id="page" hidden></section><footer id="footer"></footer><noscript>请启用 JavaScript。</noscript>
</main>
<dialog id="settings" aria-labelledby="settings-title"><div class="dialog-head"><h2 id="settings-title">设置</h2><button data-close="settings" aria-label="关闭设置">×</button></div><form id="settings-form"><label class="setting-row">刷新间隔<select name="interval" id="interval"><option value="site">跟随站点</option><option value="0">手动</option><option value="2000">2 秒</option><option value="5000">5 秒</option><option value="10000">10 秒</option><option value="30000">30 秒</option><option value="60000">60 秒</option><option value="300000">300 秒</option></select></label><label class="setting-row">布局<select id="view-preference"><option value="site">跟随站点</option><option value="cards">卡片</option><option value="compact">紧凑</option><option value="mini">迷你</option><option value="list">列表</option><option value="board">看板</option></select></label><label class="setting-row">外观<select id="appearance"><option value="site">跟随站点</option><option value="light">浅色</option><option value="dark">深色</option><option value="system">跟随系统</option></select></label><fieldset><legend>线路（最多 6 条）</legend><div id="task-options"></div><p id="task-limit" role="status"></p></fieldset><details><summary>配色</summary><div id="color-options"></div><button type="button" id="colors-follow">跟随站点配色</button><button type="button" id="colors-reset">恢复墨水配色</button></details><a href="/admin/themes" id="site-settings-link" hidden>主题管理</a><p id="storage-error" class="message" hidden></p><div class="dialog-actions"><button id="tasks-auto" type="button">线路跟随站点</button><button type="submit" class="primary">保存</button></div></form></dialog>
<dialog id="detail" aria-labelledby="detail-title"><div class="dialog-head"><div><h2 id="detail-title"></h2><p id="detail-sub"></p></div><button data-close="detail" aria-label="关闭详情">×</button></div><select id="detail-node" aria-label="切换节点" hidden></select><label id="offline-cache-row" hidden><input type="checkbox" id="offline-cache"> 显示离线缓存</label><div id="detail-body"></div><section id="dashboard" aria-label="指标图表"></section></dialog>
</body></html>
